<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occuris Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette and rules per DESIGN.md: warm paper default, dusk for photophobia; Okabe-Ito status hues;
   every status carries icon + word + colour; no ambient motion; 60px+ targets; no timeouts. */
:root{
  --bg:#F7F6F3; --card:#FFFEFC; --sunk:#F2F1ED; --hair:#E9E7E1;
  --text:#1A1B1E; --text-2:#61646C; --text-3:#93969E;
  --accent:#2563A8; --accent-soft:#EAF1F9;
  --ok:#1B7A5A; --ok-soft:#E7F3EE; --wait:#8A5A12; --wait-soft:#FBF2E4; --stop:#9C3A28; --stop-soft:#FBEBE7;
  --sh-sm:0 1px 2px rgba(26,27,30,.04),0 2px 8px rgba(26,27,30,.04);
  --sh:0 1px 2px rgba(26,27,30,.05),0 8px 24px rgba(26,27,30,.06);
  --sh-orb:0 10px 34px -8px rgba(37,99,168,.45),0 2px 8px rgba(26,27,30,.08);
  --r:18px; --r-sm:12px; --tap:60px;
}
:root[data-theme="dusk"]{
  --bg:#15171C; --card:#1D2026; --sunk:#23262D; --hair:#2E323A;
  --text:#EDECE8; --text-2:#A6A9B2; --text-3:#767A84;
  --accent:#6BA8E8; --accent-soft:#1B2733;
  --ok:#59C39C; --ok-soft:#16261F; --wait:#DBA25E; --wait-soft:#2A2216; --stop:#E89179; --stop-soft:#2B1B17;
  --sh-sm:0 1px 2px rgba(0,0,0,.35); --sh:0 2px 4px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  --sh-orb:0 10px 34px -8px rgba(107,168,232,.35),0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 17px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv05","ss01","tnum"}
.wrap{max-width:620px;margin:0 auto;padding:0 22px 90px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15.5px;letter-spacing:-.012em;color:var(--text-2)}
.hbtns{display:flex;gap:7px}
.chip{height:36px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:var(--card);border:1px solid var(--hair);border-radius:999px;box-shadow:var(--sh-sm);color:var(--text-2);font-size:13px;font-weight:500}
.chip:hover{color:var(--text);border-color:var(--text-3)}
.mode{font-size:12px;color:var(--text-3);padding:0 8px}
.hero{padding:40px 0 10px;text-align:center}
.orbwrap{position:relative;width:172px;height:172px;margin:0 auto}
.halo{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 68%)}
.orb-btn{position:absolute;inset:0;border:none;background:none;padding:0;cursor:pointer;border-radius:50%}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(40% 36% at 33% 27%,rgba(255,255,255,.75),transparent 60%),linear-gradient(150deg,#4A90D9,var(--accent));box-shadow:var(--sh-orb),inset 0 0 0 1px rgba(255,255,255,.22);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.orb-btn:hover .orb{transform:scale(1.03)} .orb-btn:active .orb{transform:scale(.98)}
.orb-btn[aria-pressed=true] .orb{background:radial-gradient(40% 36% at 33% 27%,rgba(255,255,255,.7),transparent 60%),linear-gradient(150deg,#E0806A,#C25A46);box-shadow:0 10px 34px -8px rgba(194,90,70,.5),inset 0 0 0 1px rgba(255,255,255,.22)}
.orb-btn.busy .orb{filter:saturate(.6)}
.glyph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none}
.bars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px;pointer-events:none}
.bars i{width:5px;height:12px;border-radius:3px;background:#fff;transition:height .07s linear}
.hero h1{margin:30px 0 7px;font-size:28px;font-weight:650;letter-spacing:-.028em;line-height:1.22}
.hero p{margin:0 auto;max-width:36ch;color:var(--text-2);font-size:16px;min-height:1.6em}
.row{display:flex;gap:9px;margin-top:30px}
.field{flex:1;min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--hair);box-shadow:var(--sh-sm)}
.field::placeholder{color:var(--text-3)}
.go{min-height:var(--tap);padding:0 24px;border:none;border-radius:var(--r-sm);cursor:pointer;background:var(--accent);color:#fff;font-weight:600;box-shadow:var(--sh-sm)}
.prefs{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)}
.prefs select{height:34px;padding:0 24px 0 10px;border-radius:999px;cursor:pointer;font-size:12.5px;background:transparent;border:1px solid var(--hair);color:var(--text-2);appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4.5px 4.5px,4.5px 4.5px;background-repeat:no-repeat;max-width:220px}
.hint{margin-top:22px;text-align:center;font-size:13.5px;color:var(--text-3)}
.hint kbd{font:inherit;font-size:12.5px;padding:2px 7px;border-radius:6px;background:var(--sunk);border:1px solid var(--hair);color:var(--text-2)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.085em;text-transform:uppercase;color:var(--text-3);margin:34px 0 10px;padding-left:3px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.pending-top{padding:21px 23px 19px;position:relative}
.pending-top::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--wait)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--wait-soft);color:var(--wait);font-size:11px;font-weight:650;letter-spacing:.05em;margin-bottom:12px}
.card h3{margin:0 0 11px;font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1.38}
.because{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunk);font-size:14.5px;line-height:1.5;color:var(--text-2)}
.because svg{flex:none;margin-top:3px;color:var(--accent)}
.acts{display:flex;gap:12px;padding:14px 23px;border-top:1px solid var(--hair);background:var(--sunk)}
.yes{min-height:50px;padding:0 26px;border:none;border-radius:var(--r-sm);cursor:pointer;background:var(--accent);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:9px;box-shadow:var(--sh-sm)}
.no{min-height:50px;padding:0 20px;margin-left:auto;cursor:pointer;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-sm);color:var(--text-2);font-weight:500}
.item{display:flex;gap:13px;padding:16px 21px;border-bottom:1px solid var(--hair);animation:land .16s ease-out}
.item:last-child{border-bottom:none}
@keyframes land{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:1px;font-size:13px;font-weight:700}
.dot.done{background:var(--ok-soft);color:var(--ok)} .dot.failed,.dot.not_attempted{background:var(--stop-soft);color:var(--stop)}
.dot.pending{background:var(--wait-soft);color:var(--wait)} .dot.skipped_duplicate{background:var(--wait-soft);color:var(--wait)} .dot.info{background:var(--accent-soft);color:var(--accent)}
.meta{font-size:11px;font-weight:650;letter-spacing:.075em;text-transform:uppercase;color:var(--text-3);margin-bottom:3px}
.item p{margin:0;font-size:15.5px;line-height:1.5}
.open{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;margin-top:10px;border-radius:999px;background:var(--sunk);border:1px solid var(--hair);color:var(--text);font-size:14px;font-weight:500;text-decoration:none}
.open:hover{border-color:var(--text-3)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-2)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.tally{display:flex;align-items:center;gap:8px;margin-top:14px;padding-left:4px;font-size:13px;color:var(--text-3)}
.tally b{color:var(--text-2);font-weight:600}
.raw{margin-top:10px;font-size:12.5px;color:var(--text-3)} .raw b{color:var(--text-2);font-weight:500}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:520px){.orbwrap{width:148px;height:148px}.hero h1{font-size:24px}.acts{flex-wrap:wrap}.no{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="2.8" fill="currentColor"/><circle cx="12" cy="12" r="6.4" stroke="currentColor" stroke-width="1.5" opacity=".5"/><circle cx="12" cy="12" r="10.2" stroke="currentColor" stroke-width="1.3" opacity=".22"/></svg>
    Occuris Echo <span class="mode" id="mode"></span>
  </div>
  <div class="hbtns"><button class="chip" id="theme"><span id="tl">Dusk</span></button></div>
</header>

<div class="hero">
  <div class="orbwrap">
    <span class="halo"></span>
    <button class="orb-btn" id="mic" aria-pressed="false" aria-label="Press to speak">
      <span class="orb"></span>
      <span class="glyph" id="glyph"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.4 11a6.6 6.6 0 0 0 13.2 0M12 17.6V21"/></svg></span>
      <span class="bars" id="bars" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </button>
  </div>
  <h1 id="headline">What do you need?</h1>
  <p id="sub" aria-live="polite">Say it once. I'll handle Gmail, Calendar and Slack — then tell you exactly what I did.</p>
</div>

<div class="row">
  <input class="field" id="text" type="text" placeholder="or type it here…" aria-label="Type a request">
  <button class="go" id="send">Send</button>
</div>
<div class="prefs">
  Voice <select id="voice" aria-label="Voice"></select>
  Speed <select id="rate" aria-label="Speed"><option>0.8</option><option selected>1</option><option>1.3</option><option>1.6</option></select>
  <label class="toggle"><input type="checkbox" id="autoopen"> Open the app after each action</label>
</div>
<p class="hint">Nothing is sent until you say yes. <kbd>Space</kbd> to start and stop speaking · <kbd>Esc</kbd> to cancel</p>
<p class="raw" id="raw" hidden></p>

<div id="pendbox" hidden>
  <div class="label">Waiting for you</div>
  <div class="card">
    <div class="pending-top">
      <span class="pill">⏸ NOT SENT YET</span>
      <h3 id="pend-what"></h3>
      <div class="because" id="pend-why"></div>
    </div>
    <div class="acts">
      <button class="yes" id="yes">✓ Yes, do it</button>
      <button class="no" id="no">Don't</button>
    </div>
  </div>
</div>

<div id="logbox" hidden>
  <div class="label">What I did</div>
  <div class="card" id="log" aria-live="polite"></div>
  <div class="tally" id="tally"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;
try{ if(localStorage.getItem('echo-theme')==='dusk') root.dataset.theme='dusk'; }catch(e){}
$('tl').textContent=root.dataset.theme==='dusk'?'Paper':'Dusk';
$('theme').onclick=()=>{const d=root.dataset.theme==='dusk';root.dataset.theme=d?'':'dusk';$('tl').textContent=d?'Dusk':'Paper';try{localStorage.setItem('echo-theme',d?'':'dusk')}catch(e){}};

// ---------- speech out
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));const sel=$('voice');sel.innerHTML='';
  const pref=[...voices].sort((a,b)=>(/Natural|Online/.test(b.name)-/Natural|Online/.test(a.name)));
  pref.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name.replace(/Microsoft |Online \(Natural\)|- English.*$/g,'').trim();sel.appendChild(o)});
  try{const s=localStorage.getItem('echo-voice');if(s)sel.value=s}catch(e){}}
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
$('voice').onchange=()=>{try{localStorage.setItem('echo-voice',$('voice').value)}catch(e){}};
try{ $('autoopen').checked = localStorage.getItem('echo-autoopen')==='1'; }catch(e){}
$('autoopen').onchange=()=>{ try{localStorage.setItem('echo-autoopen',$('autoopen').checked?'1':'0')}catch(e){} };
const opened=new Set();
function maybeOpen(tr){ if(!$('autoopen').checked) return;
  for(const a of (tr.actions||[])){ if(a.status==='done' && a.link && !a.link.startsWith('#') && !opened.has(a.link)){ opened.add(a.link); window.open(a.link,'_blank','noopener'); } } }
function speak(text){ if(!text)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
  const v=voices.find(v=>v.name===$('voice').value); if(v)u.voice=v; u.rate=parseFloat($('rate').value)||1; speechSynthesis.speak(u); }

// ---------- speech in
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null,meterTimer=null;
let buffer=[], wantListening=false, silence=null; const SILENCE_MS=8000;
function listen(){ if(!SR){$('sub').textContent='Voice input needs Edge or Chrome — the text box works the same.';return}
  if(rec){ wantListening=false; rec.stop(); return }   // second click = done
  speechSynthesis.cancel();                             // never let the mic hear Echo's own voice
  buffer=[]; wantListening=true; startSession();
}
function armSilence(){ clearTimeout(silence); silence=setTimeout(()=>{ wantListening=false; if(rec) rec.stop(); }, SILENCE_MS); }
function startSession(){
  rec=new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true;
  let finals=[];
  $('mic').setAttribute('aria-pressed','true'); $('bars').hidden=false; $('glyph').hidden=true;
  $('headline').textContent='Listening'; $('sub').textContent='Take your time — pauses are fine. Click the orb again when you’re done.';
  meterTimer=setInterval(()=>{[...$('bars').children].forEach((b,i)=>b.style.height=(10+Math.abs(Math.sin(Date.now()/190+i*.8))*30*(.5+Math.random()*.5))+'px')},70);
  rec.onresult=e=>{ finals=[]; let interim='';
    for(const r of e.results)(r.isFinal?finals.push(r[0].transcript.trim()):(interim+=r[0].transcript));
    $('text').value=(buffer.concat(finals).join(' ')+' '+interim).trim(); armSilence(); };
  rec.onend=()=>{ buffer=buffer.concat(finals); finals=[]; rec=null;
    if(wantListening){ try{ startSession(); return; }catch(e){} }   // Edge ended the session on its own — keep going
    clearTimeout(silence); clearInterval(meterTimer);
    $('mic').setAttribute('aria-pressed','false'); $('bars').hidden=true; $('glyph').hidden=false;
    const said=$('text').value.trim();
    if(said){ send(said); } else { $('headline').textContent='What do you need?'; $('sub').textContent="I didn't hear anything — try again, or type it."; } };
  rec.start(); armSilence();
  rec.onerror=e=>{ if(e.error==='no-speech'){ return } wantListening=false; $('sub').textContent='Mic error: '+e.error+'. You can type instead.'; };
}
$('mic').onclick=listen;
addEventListener('keydown',e=>{ if(e.code==='Space'&&e.target===document.body){e.preventDefault();listen()}
  if(e.key==='Escape'){ if(!$('pendbox').hidden) send('no'); speechSynthesis.cancel(); } });

// ---------- agent
async function send(text){ text=(text||$('text').value).trim(); if(!text)return;
  $('text').value=''; $('mic').classList.add('busy'); $('headline').textContent='Working…'; $('sub').textContent=''; $('raw').hidden=false; $('raw').innerHTML='You said: <b>'+esc(text)+'</b>';
  try{ const r=await fetch('/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}); const tr=await r.json(); render(tr); maybeOpen(tr); }
  catch(e){ $('sub').textContent='Could not reach the agent: '+e; }
  $('mic').classList.remove('busy'); }
$('send').onclick=()=>send(); $('text').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('yes').onclick=()=>send('yes'); $('no').onclick=()=>send('no');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(tr){
  const q=tr.question, rb=tr.readback;
  $('headline').textContent = q ? 'One question' : (tr.gate==='CONFIRM_REQUIRED' && tr.pending.length ? 'Ready — say yes' : 'Done');
  $('sub').textContent = rb; speak(rb);
  // pending card — derived from server state (requested − completed), never a local flag
  const pend=tr.pending||[];
  if(pend.length){ const p=pend[0];
    $('pend-what').textContent = describe(p);
    $('pend-why').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg><div>'+esc(p.evidence||'Ready to send when you say yes.')+(p.conflict?' <b>Note:</b> this overlaps with '+esc(p.conflict)+'.':'')+'</div>';
    $('pendbox').hidden=false; } else { $('pendbox').hidden=true; }
  refreshLog();
}
function describe(p){ const who=p.recipient||p.title||''; const op={reply:'Reply to',send:'Email',post:'Message',create:'Add',update:'Move'}[p.op]||p.op;
  return `${op} ${who}${p.message?' — “'+p.message+'”':''}`; }
async function refreshLog(){ const s=await (await fetch('/state')).json(); $('mode').textContent=s.mode==='twins'?'· sandbox':''; const log=s.log||[];
  if(!log.length){$('logbox').hidden=true;return} $('logbox').hidden=false;
  const el=$('log'); el.innerHTML='';
  const icon={done:'✓',pending:'⏸',failed:'✕',not_attempted:'✕',skipped_duplicate:'↺',info:'i'};
  const word={done:'done',pending:'waiting',failed:'failed',not_attempted:'not sent',skipped_duplicate:'already done',info:''};
  log.slice(-12).forEach(l=>{ const d=document.createElement('div'); d.className='item';
    const appName={gmail:'Gmail',calendar:'Calendar',slack:'Slack'}[l.app]||l.app;
    const open = (l.status==='done' && l.link) ? (l.link.startsWith('#') ? `<span class="open" aria-disabled="true">Sandbox — nothing real to open</span>` : `<a class="open" href="${esc(l.link)}" target="_blank" rel="noopener">Open in ${appName} ↗</a>`) : '';
    d.innerHTML=`<span class="dot ${l.status}" aria-hidden="true">${icon[l.status]||'•'}</span><div><div class="meta">${esc(l.app)}${word[l.status]?' · '+word[l.status]:''}</div><p>${esc(l.text)}</p>${open}</div>`; el.appendChild(d); });
  const done=log.filter(l=>l.status==='done').length, wait=log.filter(l=>l.status==='pending').length, bad=log.filter(l=>/failed|not_attempted/.test(l.status)).length;
  const apps=new Set(log.filter(l=>l.status==='done').map(l=>l.app)).size;
  $('tally').innerHTML=`<b>${apps} app${apps===1?'':'s'}</b> updated · ${done} done${wait?' · '+wait+' waiting':''}${bad?' · '+bad+' need you':''}`;
}
refreshLog();
</script>
</body>
</html>
